pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'map6b6t'

include 'mc1204', 'mc12111', 'mc2612'
project(':mc1204').projectDir = file('versions/1.20.4')
project(':mc12111').projectDir = file('versions/1.21.11')
project(':mc2612').projectDir = file('versions/26.1.2')
