plugins {
    id 'fabric-loom' version '1.14.10' apply false
    id 'net.fabricmc.fabric-loom' version '1.18.2' apply false
}

tasks.register('jars') {
    group = 'build'
    description = 'Build Fabric jars for 1.20.4, 1.21.11, and 26.x'
    dependsOn ':mc1204:remapJar', ':mc12111:remapJar'
    doLast {
        copy {
            from project(':mc12111').tasks.named('remapJar').get().archiveFile
            into "versions/1.21.11/build/libs"
            rename { String fileName -> fileName.replace('1.21+', '26.x+') }
        }
    }
}

tasks.register('copyWebsiteJars') {
    group = 'build'
    dependsOn 'jars'
    doLast {
        def dest = file("${rootDir}/../Server/Website/mods")
        dest.mkdirs()
        copy {
            from project(':mc1204').tasks.named('remapJar').get().archiveFile
            from project(':mc12111').tasks.named('remapJar').get().archiveFile
            from "versions/1.21.11/build/libs"
            include "*26.x+*.jar"
            into dest
        }
    }
}

tasks.register('jar') {
    group = 'build'
    dependsOn 'jars'
}

tasks.register('runClient') {
    group = 'fabric'
    description = 'Runs Minecraft client (defaults to 1.21.11)'
    dependsOn ':mc12111:runClient'
}
