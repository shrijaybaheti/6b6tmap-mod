plugins {
    id 'fabric-loom' version '1.14.10' apply false
    id 'net.fabricmc.fabric-loom' version '1.18.2' apply false
}

tasks.register('jars') {
    group = 'build'
    description = 'Build Fabric jars for 1.20, 1.21.1, 1.21.4, 1.21.5, 1.21.11, 26.1, 26.2, 26.3'
    dependsOn ':mc120:remapJar', ':mc1211:remapJar', ':mc1214:remapJar', ':mc1215:remapJar', ':mc12111:remapJar', ':mc261:jar', ':mc262:jar', ':mc263:jar', ':mc26x:jar'
}

tasks.register('copyWebsiteJars') {
    group = 'build'
    dependsOn 'jars'
    doLast {
        def dest = file("${rootDir}/../Server/Website/mods")
        dest.mkdirs()
        copy {
            from project(':mc1204').tasks.named('remapJar').get().archiveFile
            from project(':mc12111').tasks.named('remapJar').get().archiveFile
            from project(':mc26x').tasks.named('jar').get().archiveFile
            into dest
        }
    }
}

tasks.register('jar') {
    group = 'build'
    dependsOn 'jars'
}

tasks.register('runClient') {
    group = 'fabric'
    description = 'Runs Minecraft client (defaults to 1.21.11)'
    dependsOn ':mc12111:runClient'
}
