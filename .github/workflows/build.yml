name: Build Mod Jars

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew jars -Porg.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64,$JAVA_HOME_25_X64 --no-daemon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: map6b6t-jars
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
            !versions/*/build/libs/*-dev.jar

      - name: Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release view --json tagName -q .tagName)
          for jar in versions/*/build/libs/*.jar; do
            if [[ "$jar" != *"-sources.jar" && "$jar" != *"-dev.jar" ]]; then
              gh release upload "$LATEST_TAG" "$jar" --clobber
            fi
          done
